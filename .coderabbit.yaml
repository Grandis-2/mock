# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# 외부 예약 Mock 코드 리뷰 설정. be 저장소의 설정을 바탕으로 Mock 에 맞게 줄였다.
#
# 규칙은 "무엇을 지적할 것" 으로만 쓴다. 스타일 · 포맷은 리뷰 대상이 아니다. 정확성과 계약 위반만 본다.
# 계약 정본은 docs/api.md 다. 구현과 다르면 둘 중 하나가 버그다.

language: "ko-KR"

tone_instructions: |
  한국어로, 근거를 먼저 말하고 수정안을 제시한다.
  추측이면 추측이라고 밝힌다. 확실하지 않은 지적은 질문 형태로 남긴다.
  취향 차이(네이밍 선호, 줄바꿈, 주석 스타일)는 언급하지 않는다.

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  suggested_reviewers: true
  auto_assign_reviewers: false
  poem: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    labels:
      - "!skip-review"
    auto_incremental_review: true
    drafts: false
    auto_pause_after_reviewed_commits: 20
    # 작업 브랜치는 에픽으로, 에픽은 dev 로 올라온다. 기본값은 기본 브랜치(dev)만 리뷰해서
    # 에픽으로 가는 PR 이 전부 "Review skipped" 였다.
    base_branches:
      - "main"
      - "dev"
      - "epic/.*"
    ignore_title_keywords:
      - "wip"
      - "[skip review]"

  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!gradle/**"
    - "!gradlew"
    - "!gradlew.bat"

  path_instructions:
    - path: "**/*.java"
      instructions: |
        # 이 Mock 이 지키려는 것
        본 서비스가 "외부가 느리거나 실패해도 같은 예약을 두 번 등록하지 않는지" 시험하는 기준이다.
        Mock 이 틀린 답을 주면 그 시험 전체를 믿을 수 없다.

        # 반드시 지적할 것
        - 주입한 실패(지연 · 주사위 · HTTP_5XX · TIMEOUT)가 커밋 뒤에 일어나는 코드.
          주입한 실패는 모두 커밋 전이어야 하고, 커밋 후에 일어나는 것은 결함(RESPONSE_LOST_AFTER_COMMIT)뿐이다.
        - 실패(5xx)를 저장해 같은 키 재요청에 재생하는 코드. 실패율을 0 으로 내리면 같은 키가 곧바로 성공해야 한다.
        - 트랜잭션 안에서 지연(Thread.sleep)하거나 연결을 붙잡는 코드. 커넥션 풀이 마른다.
        - 재시도해도 결과가 같은 요청(형식 오류 · 모르는 필드 · 범위 밖 값)이 500 으로 나가는 경로.
          500 은 워커가 재시도하는 일시 실패라는 뜻이다. 반드시 4xx 로 내보낸다.
        - 같은 키 처리에서 잠금 없이 조회한 뒤 INSERT · UPDATE 하는 check-then-act.
          키 행 잠금 또는 PK 중복(1062) 재시도로 막아야 한다.
        - 결과 불명(응답 없음)을 만드는 경로가 헤더를 먼저 내보내는 코드. 클라이언트가 500 을 받은 것으로 처리한다.
        - 예외를 삼키는 catch, 로그만 남기고 흘려보내는 처리.
        - 시각을 UTC 가 아닌 시스템 기본 시간대에 기대는 코드.

        # 지적하지 말 것
        - 포맷팅, import 순서, 줄바꿈, 변수명 취향, 주석 유무.

    - path: "src/main/java/**/registration/**/*.java"
      instructions: |
        # 등록 파트 — 예약 원장
        - 등록 순서: 키 행 잠금 → 취소 표식 우선(409) → 재생 또는 422 → INSERT. 순서가 바뀌면 지적한다.
          취소 표식 검사가 재생보다 뒤면 "등록 → 취소 → 재등록" 이 201 로 재생된다.
        - 재생 경로에서 결함이 발동하면 지적한다. 결함은 새로 커밋한 등록에만 발동한다.
        - 키 조회(by-key)가 잠금 없이 읽으면 지적한다. 트랜잭션 안의 등록을 기다리지 못한다.
        - 격리 수준 전제(READ COMMITTED)를 설정 파일에만 기대는 트랜잭션은 질문으로 남긴다.

    - path: "src/main/java/**/control/**/*.java"
      instructions: |
        # 제어 파트 — 설정 · 결함 · 초기화
        - 제어 API 에 지연 · 실패를 주입하면 지적한다. 실패율 1.0 상태에서도 설정을 되돌리고 초기화할 수 있어야 한다.
        - 응답이 요청값이 아니라 실제 적용값이어야 한다. 요청값을 그대로 돌려주면 지적한다.
        - 초기화가 설정을 지우면 지적한다. 기록과 결함만 지운다.

    - path: "src/main/java/**/global/chaos/**/*.java"
      instructions: |
        - 설정 스냅샷이 불변이 아니거나, 한 요청 안에서 설정을 두 번 읽으면 지적한다. 진행 중 설정 변경이 섞인다.
        - 결함을 꺼내고 지우는 동작이 원자적이지 않으면 지적한다(같은 결함이 두 번 발동할 수 있다).

    - path: "src/test/**/*.java"
      instructions: |
        - 잠금 · 1062 · 콜레이션처럼 DB 동작에 기대는 시험이 H2 에서만 돌면 지적한다. MySQL(Testcontainers)로 증명한다.
        - 경쟁 조건을 찾는 동시성 시험이 한 번만 돌면 지적한다. 같은 키 동시 등록 · 취소는 최소 100회 반복한다.
        - 특정 결함을 재현하는 회귀 시험(예: 격리 수준이 빠지면 매 회차 교착하는 조건)은 횟수만으로 지적하지 않는다.
          고치기 전 실패 · 고친 뒤 통과 근거가 PR 에 있는지 확인한다.
        - 고정된 sleep 으로 비동기를 기다리면 지적한다. 래치 · 조건 대기로 바꾼다.
        - 단정 없이 실행만 하는 시험은 지적한다.

    - path: "src/test/java/**/load/**/*.java"
      instructions: |
        # 부하 하네스
        - 판정 규칙이 출력만 되고 검사되지 않으면 지적한다. 합격 조건은 코드로 판정한다.
        - 백분위끼리 더하거나 빼서 새 백분위로 부르면 지적한다. 분위수는 더해지지 않는다.
        - 결과 불명 키를 DB 대조에서 아무 확인 없이 빼면 지적한다.

    - path: "docs/**/*.md"
      instructions: |
        - docs/api.md 가 계약 정본이다. 다른 문서가 api.md 와 다른 숫자 · 규칙을 적으면 지적한다.
        - 코드와 다른 동작을 설명하면 지적한다(예: 유지 시간 뒤 실제로는 빈 500 을 보내는데 "응답 없이 끊는다").

    - path: ".github/workflows/**"
      instructions: |
        - permissions 를 명시하지 않으면 최소 권한으로 지정하도록 제안한다.
        - 시험 단계를 건너뛰거나, 건너뛴 시험을 통과로 두는 변경은 근거를 묻는다.

  pre_merge_checks:
    title:
      mode: "error"
      requirements: |
        형식은 <type>(<이슈 키>): <요약> 이다. 예: feat(NV-6): 설정 조회 API 추가
        type 은 feat · fix · refactor · test · docs · chore 중 하나.
        요약은 한국어이고 마침표로 끝내지 않는다.
        리뷰 반영 커밋만으로 된 PR 은 없으므로 PR 제목에는 이슈 키가 있어야 한다.
    description:
      mode: "error"
    # 끈다 — 주석은 "왜" 가 필요한 곳에만 단다는 이 저장소 기준과 맞지 않는다. 함수 수로 비율을 재면
    # getter · 시험 메서드까지 세어져, 매 PR 에 경고만 붙고 고칠 것이 없다(#22: 56.79% / 기준 80%).
    docstrings:
      mode: "off"

  tools:
    gitleaks: { enabled: true }
    actionlint: { enabled: true }
    yamllint: { enabled: true }
    github-checks: { enabled: true }
    # 끈다 — 한국어 문서에서 오탐이 많다
    languagetool: { enabled: false }
    markdownlint: { enabled: false }

chat:
  auto_reply: true
  art: false
