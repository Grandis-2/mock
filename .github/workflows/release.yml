name: release

# main 에 들어간 것만 이미지가 되고, 운영 DB 마이그레이션을 먼저 적용한 뒤 ECS 의 Mock 이 그 이미지로 다시 뜬다.
# PR 은 build.yml 이 검증만 한다. 하는 일은 _ 로 시작하는 파일에 역할별로 있다. 이 파일은 순서와 이름만 정한다.
#
#   build ──→ image ──┬─→ migrate ──→ deploy
#   database ─────────┘
#
# 순서의 이유: 새 코드가 쓸 표 · 칸이 먼저 있어야 하고(migrate → deploy), 마이그레이션은 되돌리지 않으므로
# 올릴 이미지가 그 표로 뜨는 것을 확인한 뒤에만 적용한다(image → migrate). 앞에서 실패하면 뒤는 돌지 않는다.
on:
  push:
    branches: [main]
  # 실패한 배포를 다시 시도한다. main 에서만 돈다. 이 커밋의 이미지가 이미 올라가 있으면 새로 만든 것이 아니라 그 이미지를 배포한다
  workflow_dispatch:

# 한 번에 하나만 돈다. 겹쳐 돌면 latest 를 누가 마지막에 옮기는지 정해지지 않는다.
# 대기는 하나만 남으므로 연달아 푸시하면 중간 커밋은 건너뛴다. latest 는 마지막 내용을 따라간다.
# 새 푸시 뒤에 옛 실행을 다시 돌리지 않는다 — latest 를 옛 이미지로 되감고 그대로 배포한다. 되돌릴 때는 되돌림 커밋을 올린다.
concurrency:
  group: release
  cancel-in-progress: false

# 기본은 권한 없음이다. job 마다 필요한 것만 준다. AWS 자격(id-token)은 migrate · deploy 둘만 받는다.
permissions: {}

# 이름은 여기서만 정한다. 저장소 · 클러스터 · 서비스 · 파라미터는 인프라(nova-infra)가 만든 것과 같아야 한다.
#   ECR  nova/mock            application/mock/service.yml 의 서비스 이미지
#   ECR  nova/mock-migration  Mock 마이그레이션 태스크의 이미지
#   ECS  nova-prod 클러스터의 nova-prod-mock 서비스
#   SSM  /nova-prod/mock-migration/run-task  마이그레이션 태스크를 띄울 값
jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yml
    with:
      jar-artifact: jar

  database:
    permissions:
      contents: read
    uses: ./.github/workflows/_database.yml
    with:
      base: ${{ github.event.before }}

  image:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/_image.yml
    with:
      jar-artifact: jar
      image-artifact: image

  migrate:
    needs: [database, image]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_migrate.yml
    with:
      aws-region: ${{ vars.AWS_REGION }}
      cluster: nova-prod
      repository: nova/mock-migration
      parameter: /nova-prod/mock-migration/run-task
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  deploy:
    needs: [image, migrate]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy.yml
    with:
      aws-region: ${{ vars.AWS_REGION }}
      cluster: nova-prod
      service: nova-prod-mock
      repository: nova/mock
      image-artifact: image
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
