name: build

# PR 과 dev 를 검증만 한다. 아무것도 올리지 않고 AWS 에 닿지 않는다.
# main 은 release.yml 이 같은 검증을 돌린 뒤 올리고 배포한다 — 여기서 한 번 더 돌리지 않는다.
# 하는 일은 _ 로 시작하는 파일에 역할별로 있다. 이 파일은 순서만 정한다.
on:
  pull_request:
    branches: [main, dev, 'epic/**']
  push:
    branches: [dev]

# 같은 PR 에 새 커밋이 올라오면 이전 실행을 취소한다. 러너 시간을 아낀다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 기본은 권한 없음이다. job 마다 필요한 것만 준다 — 불러 쓰는 워크플로는 여기서 준 것보다 많이 가질 수 없다.
permissions: {}

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yml
    with:
      jar-artifact: jar

  database:
    permissions:
      contents: read
    uses: ./.github/workflows/_database.yml
    with:
      base: ${{ github.event.pull_request.base.sha || github.event.before }}

  image:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/_image.yml
    with:
      jar-artifact: jar
