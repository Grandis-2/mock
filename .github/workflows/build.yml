name: build

on:
  pull_request:
    branches: [main, dev, 'epic/**']
  push:
    branches: [main, dev]

# 같은 PR 에 새 커밋이 올라오면 이전 실행을 취소한다. 러너 시간을 아낀다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 읽기만 한다. 이 워크플로는 저장소에 쓰지 않는다.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # MySQL 동시성 시험은 Testcontainers 로 컨테이너를 직접 띄운다. ubuntu 러너에는 Docker 가 있다.
      # 시험용 설정(src/test/resources/application.yml)만으로 돈다 — main 의 application.yml 은 추적하지 않는다.
      - run: ./gradlew build --no-daemon

      # 초록과 별개로 "시험이 정말 돌았는가" 를 본다. 결과가 비었거나 건너뜀이 있으면 실패다.
      # Docker 가 없으면 MySQL 시험이 조용히 건너뛰어지고 빌드는 초록이 된다. 동시성 보장의 유일한 증거가
      # 그 시험이라, 건너뛴 채로 초록을 두지 않는다.
      - name: test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re, sys
          files = glob.glob('build/test-results/test/*.xml')
          tot = {'tests': 0, 'skipped': 0, 'failures': 0, 'errors': 0}
          skipped = []
          for f in files:
              text = open(f, encoding='utf-8').read()
              m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', text)
              if not m:
                  print(f'::error::결과 파일을 읽지 못했다: {f}'); sys.exit(1)
              for k, v in zip(tot, m.groups()):
                  tot[k] += int(v)
              if int(m.group(2)) > 0:
                  skipped.append(f)
          print('TEST SUMMARY', tot, 'files=%d' % len(files))
          if not files or tot['tests'] == 0:
              print('::error::시험 결과가 비었다'); sys.exit(1)
          if tot['skipped'] > 0:
              print('::error::건너뛴 시험이 있다 — Docker(Testcontainers)를 확인하라: ' + ', '.join(skipped))
              sys.exit(1)
          PY

      # 실패해도 리포트는 남긴다. 어느 시험이 깨졌는지 보려면 이게 필요하다.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7
